<!DOCTYPE html>
<html>
<head>
<title>Menu - Flexbox</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
  .menu{
    background:#0b2e6e;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 30px;
    color:white;
  }
  .links{
    display:flex;
    gap:25px;
    list-style:none;
  }
  .links a{color:white;text-decoration:none;font-weight:bold}
  .logo{font-size:22px;font-weight:bold}
</style>
</head>
<body>
  <div class="menu">
    <div class="logo">Bright Future</div>
    <ul class="links">
      <li><a href="#">Home</a></li>
      <li><a href="#">About</a></li>
      <li><a href="#">Courses</a></li>
      <li><a href="#">Contact</a></li>
    </ul>
  </div>
  <h2 style="padding:30px;">This is a horizontal menu bar using display: flex</h2>
</body>
</html>
